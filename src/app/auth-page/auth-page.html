     <div class="or-divider"><span></span></div>
       <form (submit)="loginWithEmail($event)">
      <input [formField]="loginForm.email" placeholder="Email" />
      <input type="password" [formField]="loginForm.password" placeholder="Password" />

      <!-- 2. Use the submitting() signal to show a loading state -->
      <button type="submit" [disabled]="loginForm().submitting()">
        {{ loginForm().submitting() ? 'Logging in...' : 'Login' }}
      </button>
    </form>
      @if (loginForm.email().errors(); as msg) {
  <span class="error">{{ msg }}</span>
}
<div class="or-divider">
  <span></span>
</div>
      <h2>Create an account with your email to continue</h2>

      <form [formGroup]="registrationForm" (ngSubmit)="register()">
        <fieldset>
          <legend>Register</legend>
        <input type="email" formControlName="email" placeholder="Email" required>
          <input type="password" formControlName="password" placeholder="Password" required>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm Password" required>
          <input type="text" formControlName="displayName" placeholder="Display Name" required>
          <input type="number" formControlName="GHIN" placeholder="GHIN" >
          @if(!ghinLookup){
            <input type="number" formControlName="GHIN" placeholder="GHIN" >
            <input type="number" formControlName="handicap" placeholder="Handicap" >
            <input type="number" formControlName="handicapIndex" placeholder="Handicap Index">
          } @else {
            <div class="GHIN_Info">
              <p>GHIN: {{GHIN_Info()?.ghin}}</p>
              <p>Handicap: {{GHIN_Info()?.handicapIndex}}</p>
            </div>
          }
        <button type="submit">Register</button>
</fieldset>
      </form>
